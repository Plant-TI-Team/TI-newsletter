<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Plant TI 뉴스레터 마스터 (V56.2)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f9; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 10px; margin-bottom: 20px; background: #fff; }
        textarea { width: 100%; height: 80px; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { background: #00467F; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .loading { background: #cbd5e1 !important; cursor: not-allowed; }
        .article-select-item { display: flex; align-items: center; gap: 15px; padding: 12px; border: 1px solid #eee; margin-bottom: 8px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📧 뉴스레터 마스터 (V56.2)</h1>
    
    <div class="box">
        <label>API Key:</label>
        <input type="password" id="apiKey" style="width:100%; padding:8px; margin-bottom:15px;">
        
        <label><b>전반부 가이드라인:</b></label>
        <textarea id="promptTech"></textarea>
        <button id="btnTech" onclick="extract('Tech')">전반부 추출 🛠️</button>
        
        <label style="display:block; margin-top:20px;"><b>후반부 가이드라인:</b></label>
        <textarea id="promptBiz"></textarea>
        <button id="btnBiz" onclick="extract('Biz')" style="background:#27ae60;">후반부 이어 붙이기 💼</button>
    </div>

    <div id="dropzone" contenteditable="true" style="width:100%; height:150px; border:3px dashed #FF8C00; padding:10px; overflow-y:auto; margin-bottom:15px;"></div>
    <button style="width:100%; background:#2c3e50; padding:15px;" onclick="parseArticles()">1단계: 분석 및 URL 수정 모드 🔍</button>

    <div id="selection-list" style="margin-top:20px;"></div>
    <button id="step2-btn" style="display:none; width:100%; background:#FF8C00; padding:15px; margin-top:20px;" onclick="generateFinal()">2단계: 최종 생성 📋</button>
    <div id="outlook-result"></div>
</div>

<script>
    let articles = [];

    async function extract(type) {
        const btn = document.getElementById(type === 'Tech' ? 'btnTech' : 'btnBiz');
        const originalText = btn.innerText;
        btn.disabled = true; btn.classList.add('loading'); btn.innerText = "⏳ 로딩 중...";
        
        const key = document.getElementById('apiKey').value;
        const prompt = document.getElementById(type === 'Tech' ? 'promptTech' : 'promptBiz').value;
        const drop = document.getElementById('dropzone');

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], tools: [{"googleSearch": {}}] })
            });
            const data = await res.json();
            const text = data.candidates[0].content.parts[0].text;
            if(type === 'Tech') drop.innerText = text;
            else drop.innerText += "\n\n" + text;
        } catch(e) { alert("오류 발생"); } finally { btn.disabled = false; btn.classList.remove('loading'); btn.innerText = originalText; }
    }

    function parseArticles() {
        const raw = document.getElementById('dropzone').innerText;
        const blocks = raw.split(/기사\s*\d+\./); articles = [];
        const list = document.getElementById('selection-list'); list.innerHTML = "<h3>📝 기사 URL 수정</h3>";
        
        blocks.forEach((b, i) => {
            if(i === 0) return;
            let lines = b.trim().split('\n');
            let title = lines[0].trim();
            let urlMatch = b.match(/https?:\/\/[^\s]+/);
            articles.push({ title, url: urlMatch ? urlMatch[0] : "", html: lines.slice(1).join('<br>') });
            
            list.innerHTML += `<div class="article-card">
                <b>${title}</b><br>
                <button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(title)}')">제목 검색 🔍</button>
                <input type="text" value="${articles[i-1].url}" style="width:100%; margin-top:5px;" onchange="articles[${i-1}].url = this.value">
            </div>`;
        });
        document.getElementById('step2-btn').style.display = 'block';
    }

    function generateFinal() {
        const res = document.getElementById('outlook-result');
        res.innerHTML = articles.map(a => `<div><h2>${a.title}</h2><a href="${a.url}">${a.url}</a></div>`).join('');
    }
</script>
</body>
</html>
