<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Plant TI 뉴스레터 매직 빌더 V60</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f9; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .ver { text-align: right; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 28px; }
        .section-title { color: #D35400; border-bottom: 2px solid #D35400; padding-bottom: 8px; margin-top: 30px; font-weight: bold; }
        
        .ai-panel { background: #f0f7ff; border: 1px solid #b3d7ff; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .ai-key-box { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .ai-key-box input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        #aiPrompt { width: 100%; min-height: 150px; border: 1px solid #b3d7ff; border-radius: 6px; padding: 12px; box-sizing: border-box; font-size: 14px; resize: vertical; line-height: 1.5; }

        .config-panel { background: #f8f9fa; border: 1px solid #e1e8ed; padding: 20px; border-radius: 10px; margin-top: 20px; display: flex; gap: 30px; align-items: center; }
        .config-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: #2c3e50; }
        input[type="color"] { width: 40px; height: 40px; border: none; cursor: pointer; background: none; }

        #dropzone {
            width: 100%; min-height: 150px; border: 3px dashed #D35400; border-radius: 10px;
            padding: 15px; box-sizing: border-box; background-color: #fffaf0; font-size: 14px; margin-bottom: 15px;
            white-space: pre-wrap; 
        }

        .article-select-item { 
            display: flex; align-items: center; gap: 15px; padding: 12px 15px; 
            background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; margin-bottom: 8px; 
        }
        .article-select-item input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; }
        .title-text { flex: 1; font-weight: bold; font-size: 15px; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .image-drop-mini {
            width: 110px; height: 65px; border: 2px dashed #00467F; background: #f8f9fa;
            border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; flex-shrink: 0;
        }
        .image-drop-mini img { max-width: 100%; max-height: 100%; }

        #final-section { display: none; margin-top: 40px; }
        .size-control-card { background: #f8f9fa; border-left: 5px solid #D35400; padding: 12px 15px; margin-bottom: 8px; border-radius: 4px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        button.primary-btn {
            display: block; width: 100%; background: #2c3e50; color: white; border: none;
            padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        button.primary-btn:hover { background: #1a252f; }
        .btn-new-tab { background: #5d6d7e; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        #outlook-result { background: white; border: 1px solid #e1e8ed; margin-top: 20px; padding: 0; }
        .notice-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; border: 1px solid #ffeeba; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="ver">Version 60.0 (Full Auto-Save Engine)</div>
    <h1>📧 Plant TI 뉴스레터 매직 빌더</h1>
    
    <h3 class="section-title" style="color:#00467F; border-color:#00467F;">Step 0. AI 기사 자동 생성 (개인별 가이드라인 무한 기억) 🤖</h3>
    <div class="ai-panel">
        <div class="ai-key-box">
            <span style="font-size: 13px; font-weight: bold; color: #333;">🔑 Gemini API Key:</span>
            <input type="password" id="apiKey" placeholder="Google AI Studio에서 발급받은 무료 API Key를 입력하세요">
        </div>
        <textarea id="aiPrompt" placeholder="여기에 기사 수집 가이드라인을 작성하세요. 입력 후 생성 버튼을 누르면 이 컴퓨터에 자동으로 영구 저장됩니다."></textarea>
        <button class="primary-btn" id="aiGenBtn" style="background:#00467F; margin-top:10px; font-size:16px; padding:12px;" onclick="generateAIArticles()">구글 라이브 검색 및 기사 생성 시작 📡</button>
    </div>
    
    <h3 class="section-title">Step 1. 기사 확인 및 정제</h3>
    <div id="dropzone" contenteditable="true" placeholder="AI 결과물이 여기에 자동으로 입력됩니다."></div>
    <button class="primary-btn" onclick="parseArticles()">1단계: 분석 및 제목 리스트 생성 🔍</button>
    
    <div id="selection-area" style="display:none; margin-top:20px;">
        <div class="config-panel">
            <div class="config-item">🎨 기사 제목 색상: <input type="color" id="titleColor" value="#D35400"></div>
            <div class="config-item">🔘 버튼 배경 색상: <input type="color" id="btnColor" value="#00467F"></div>
            <div class="config-item">📝 버튼 글자 색상: <input type="color" id="btnTextColor" value="#D1D1D1"></div>
        </div>
        <div id="selection-list" style="margin-top:20px;"></div>
        <button class="primary-btn" style="background:#D35400; margin-top:20px;" onclick="generateFinal()">2단계: 최종 뉴스레터 생성 및 크기 조절 📋</button>
    </div>

    <div id="final-section">
        <h3 class="section-title" style="color:#2c3e50; border-color:#2c3e50;">Step 2. 최종 결과물 (디자인 확인)</h3>
        <div id="size-controls"></div>
        <div id="outlook-result"></div>
        
        <div style="margin-top:30px;">
            <div class="notice-box">
                💡 <b>3단계 아웃룩 복사 안내:</b><br>
                아웃룩 본문에 붙여넣으신 후, [붙여넣기 옵션]에서 <b>'원문 서식 유지(K)'</b>를 선택해야 선택하신 색상들이 완벽하게 유지됩니다.
            </div>
            <button class="primary-btn" style="background:#27ae60;" onclick="copyToClipboard()">3단계 아웃룩 본문으로 복사하기 ✨</button>
        </div>
    </div>
</div>

<script>
    let articles = [];

    // 💡 변경 포인트 1: 페이지가 열릴 때 API 키와 가이드를 모두 메모리에서 자동 복구
    window.onload = function() {
        const savedKey = localStorage.getItem('plant_ti_gemini_key');
        if(savedKey) document.getElementById('apiKey').value = savedKey;

        const savedPrompt = localStorage.getItem('plant_ti_gemini_prompt');
        if(savedPrompt) {
            document.getElementById('aiPrompt').value = savedPrompt;
        } else {
            // 저장된 기록이 없는 최초 접속자용 기본 가이드라인 셋팅
            document.getElementById('aiPrompt').value = `아래 지정된 9개 사이트를 최우선 검색하여 지난 2주 이내의 원자력 관련 기사 3개를 선정하라.\n부족할 경우 IAEA, WNA, 각국 원자력청 공식 보도자료에서 보완하라.\n\n[필수 출력 규칙]\n1. 본문 기사 내용은 기존보다 2배 정도 길고 상세하게 작성하라.\n2. 각 기사 요약은 아래 [포맷]을 엄격히 준수하라.\n\n[포맷]\n기사 1. [기사 제목]\n기사 날짜 : [MM월 DD일]\n\n[소제목]\n-. [상세한 개조식 본문 문장]\n[소제목]\n-. [상세한 개조식 본문 문장]\n\n기사 출처 : [여기에 기사 상세 페이지의 순수 URL 주소만 기입]\n\n[검색 대상 사이트]\nhttps://www.iaea.org\nhttps://www.world-nuclear.org\nhttps://www.nei.org\nhttps://www.world-nuclear-news.org\nhttps://www.power-eng.com/nuclear\nhttps://www.inl.gov\nhttps://www.nucnet.org\nhttps://www.ans.org/news\nhttps://www.neimagazine.com`;
        }
    }

    async function generateAIArticles() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userPrompt = document.getElementById('aiPrompt').value.trim();
        
        if(!apiKey) { alert("Gemini API Key를 입력해주세요."); return; }
        if(!userPrompt) { alert("가이드라인을 입력해주세요."); return; }
        
        // 💡 변경 포인트 2: 버튼을 누르는 순간 입력한 가이드와 키를 브라우저에 즉시 박제 저장
        localStorage.setItem('plant_ti_gemini_key', apiKey);
        localStorage.setItem('plant_ti_gemini_prompt', userPrompt);
        
        const btn = document.getElementById('aiGenBtn');
        btn.innerText = "웹 서칭 및 기사 요약 중... (약 15~30초 소요) 📡";
        btn.disabled = true;

        try {
            const systemInstruction = `너는 대우건설 Plant TI 팀의 뉴스레터 작성을 돕는 전문 AI 비서다. 
            반드시 구글 라이브 검색 기능을 활용해 최신 기사를 서칭하라.
            가짜 이미지 주소를 절대 지어내지 말고, 오직 기사 내용과 기사 출처 URL만 확보하라.
            반드시 아래 명시된 [포맷] 규격을 엄격하게 준수하여 출력하라.

            [포맷]
            기사 1. [기사 제목]
            기사 날짜 : [MM월 DD일]

            [소제목]
            -. [상세하고 길게 작성된 개조식 본문 문장]
            [소제목]
            -. [상세하고 길게 작성된 개조식 본문 문장]

            기사 출처 : [여기에 기사 상세 페이지의 순수 URL 주소만 기입]

            [⚠️ 절대 규칙]: 주소 뒤에 [1], [2] 같은 검색 출처 각주 기호를 절대 붙이지 말고 순수한 http 주소만 출력하라. 서론 없이 바로 '기사 1.'로 시작하라.`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    tools: [{"googleSearch": {}}] 
                })
            });

            const data = await response.json();
            if(!data.candidates) { throw new Error("API 응답 오류"); }
            
            const aiResultText = data.candidates[0].content.parts[0].text;
            const dropzone = document.getElementById('dropzone');
            dropzone.innerText = aiResultText;
            
            alert("📡 실시간 뉴스 검색 및 원고 생성이 완료되었습니다!");
            parseArticles(); 
            
        } catch (e) {
            alert("기사 생성 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
            console.error(e);
        } finally {
            btn.innerText = "구글 라이브 검색 및 기사 생성 시작 📡";
            btn.disabled = false;
        }
    }

    document.getElementById('dropzone').addEventListener('paste', function(e) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text/plain');
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        selection.deleteFromDocument();
        const textNode = document.createTextNode(text);
        selection.getRangeAt(0).insertNode(textNode);
        selection.collapseToEnd();
    });

    function cleanUrl(url) {
        if (!url) return "#";
        let cleaned = url.split(/[\[\s\]]/)[0]; 
        return cleaned.trim();
    }

    function openNewWindow(url) {
        const cleanedUrl = cleanUrl(url);
        window.open(cleanedUrl, '_blank', `width=1100,height=850,resizable=yes,scrollbars=yes,status=yes`);
    }

    function parseArticles() {
        const dropzone = document.getElementById('dropzone');
        const rawText = dropzone.innerText || dropzone.textContent;
        const blocks = rawText.split(/기사\s*\d+\./);
        articles = [];

        for (let i = 1; i < blocks.length; i++) {
            let block = blocks[i].trim();
            let lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            let firstLine = lines[0] || "제목 없음";
            let cleanTitle = firstLine.replace(/^(제목\s*[:：]\s*)/i, "").replace(/[\[\]]/g, "").trim();
            
            let dateMatch = block.match(/(\d{1,2}월\s*\d{1,2}일)/);
            let date = dateMatch ? `[${dateMatch[0]}]` : "";
            
            let url = "#";
            let urlMatch = block.match(/기사\s*출처\s*[:：]\s*(https?:\/\/[^\s\]<>"]+)/i);
            if (urlMatch) {
                url = cleanUrl(urlMatch[1]);
            } else {
                let fallbackMatch = block.match(/https?:\/\/[^\s\]<>"]+/);
                if (fallbackMatch) url = cleanUrl(fallbackMatch[0]);
            }

            let contentLines = lines.slice(1);
            let contentText = contentLines.join('\n');
            
            const garbagePatterns = [
                /기사\s*날짜\s*[:：][^\n]*/gi,
                /기사\s*출처\s*[:：][\s\S]*/gi
            ];
            garbagePatterns.forEach(p => contentText = contentText.replace(p, ""));

            let contentHtml = contentText.split('\n')
                .filter(line => line.trim().length > 0)
                .map(line => {
                    let formattedLine = line.replace(/(\[.*?\])/g, "<b>$1</b>");
                    return `<p style="margin:0 0 10px 0; font-family:'맑은 고딕',sans-serif; font-size:15px; color:#333333; line-height:1.7;">${formattedLine}</p>`;
                }).join('');

            articles.push({ title: cleanTitle, date: date, url: url, contentHtml: contentHtml, imgData: "", selected: true, imgWidth: 320 });
        }
        renderSelection();
    }

    function renderSelection() {
        const list = document.getElementById('selection-list');
        list.innerHTML = '';
        articles.forEach((art, idx) => {
            const item = document.createElement('div');
            item.className = 'article-select-item';
            item.innerHTML = `
                <input type="checkbox" checked onchange="articles[${idx}].selected = this.checked">
                <div class="title-text">${idx+1}. ${art.title}</div>
                <button class="btn-new-tab" onclick="openNewWindow('${art.url}')">기사 그림 가져오기 🔗</button>
                <div class="image-drop-mini" id="drop_${idx}" ondragover="event.preventDefault();" ondrop="handleDrop(event, ${idx})">그림 던지기</div>
            `;
            list.appendChild(item);
        });
        document.getElementById('selection-area').style.display = 'block';
    }

    async function handleDrop(e, idx) {
        e.preventDefault();
        const html = e.dataTransfer.getData('text/html');
        const match = html.match(/src=["']([^"']+)["']/);
        if (match && match[1]) {
            const data = await fetchBase64(match[1]);
            if (data) setImage(idx, data);
        } else if (e.dataTransfer.files[0]) {
            const reader = new FileReader();
            reader.onload = (ev) => setImage(idx, ev.target.result);
            reader.readAsDataURL(e.dataTransfer.files[0]);
        }
    }

    function setImage(idx, data) {
        articles[idx].imgData = data;
        document.getElementById(`drop_${idx}`).innerHTML = `<img src="${data}">`;
    }

    function generateFinal() {
        const userTitleColor = document.getElementById('titleColor').value;
        const userBtnColor = document.getElementById('btnColor').value;
        const userBtnTextColor = document.getElementById('btnTextColor').value;

        const result = document.getElementById('outlook-result');
        const controls = document.getElementById('size-controls');
        controls.innerHTML = '';
        let html = `<table width="100%" border="0" cellspacing="0" cellpadding="0" style="font-family:'Malgun Gothic','맑은 고딕',sans-serif; max-width:850px; margin:0 auto; background-color:#ffffff; border-collapse:collapse;"><tr><td>`;
        let displayIdx = 0;
        articles.forEach((art, idx) => {
            if (!art.selected) return;
            const align = displayIdx % 2 === 0 ? "left" : "right";
            const bgColor = displayIdx % 2 === 0 ? "#ffffff" : "#ebf0f3";
            const borderColor = "#dce1e6"; 
            
            controls.innerHTML += `
                <div class="size-control-card">
                    <strong style="color:#2c3e50; width:130px;">기사 ${displayIdx+1} 그림 크기:</strong> 
                    <input type="range" min="150" max="600" value="${art.imgWidth}" oninput="updateSize(${idx}, this.value)" style="flex:1;">
                    <span id="val_${idx}" style="font-weight:bold; width:60px; color:${userTitleColor};">${art.imgWidth}px</span>
                </div>`;

            html += `
            <div id="art_block_${idx}" style="background-color:${bgColor}; padding:45px 35px; border-bottom:1px solid ${borderColor}; overflow:hidden;">
                <div style="margin-bottom:12px; display:block;">
                    <span style="font-size:23px; font-weight:bold; color:${userTitleColor} !important; -webkit-text-fill-color: ${userTitleColor} !important; line-height:1.3; font-family:'맑은 고딕',sans-serif;">기사 ${displayIdx+1}. ${art.title}</span>
                </div>
                <div style="margin-bottom:20px; display:block;">
                    <span style="font-size:14px; font-weight:bold; color:#7f8c8d !important; font-family:'맑은 고딕',sans-serif;">📅 ${art.date}</span>
                </div>
                <div style="text-align:justify; font-size:15px; color:#333333; line-height:1.8; font-family:'맑은 고딕',sans-serif; display:block;">
                    ${art.imgData ? `<img id="final_img_${idx}" src="${art.imgData}" width="${art.imgWidth}" align="${align}" hspace="25" vspace="10" border="0" style="display:inline-block; border-radius:10px; margin-${align === 'left' ? 'right' : 'left'}:25px; height:auto;">` : ""}
                    ${art.contentHtml}
                    <div style="margin-top:30px; clear:both; text-align:center; display:block;">
                        <table border="0" cellspacing="0" cellpadding="0" align="center"><tr><td align="center" bgcolor="${userBtnColor}" style="border-radius:5px; background-color:${userBtnColor};">
                            <a href="${art.url}" target="_blank" style="font-size:14px; font-weight:bold; color:${userBtnTextColor} !important; text-decoration:none; padding:8px 30px; display:inline-block; font-family:'맑은 고딕',sans-serif;">
                                <font color="${userBtnTextColor}"><span style="color:${userBtnTextColor} !important;">기사 원문 읽기 →</span></font>
                            </a>
                        </td></tr></table>
                    </div>
                </div>
            </div>`;
            displayIdx++;
        });
        html += `</td></tr></table>`;
        result.innerHTML = html;
        document.getElementById('final-section').style.display = 'block';
    }

    function updateSize(idx, val) {
        articles[idx].imgWidth = val;
        document.getElementById(`val_${idx}`).innerText = val + "px";
        const img = document.getElementById(`final_img_${idx}`);
        if(img) { img.setAttribute('width', val); img.style.width = val + "px"; img.style.height = "auto"; }
    }
    function copyToClipboard() {
        const range = document.createRange();
        range.selectNodeContents(document.getElementById('outlook-result'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        alert("✅ 디자인 복사가 완료되었습니다!");
    }
    async function fetchBase64(url) {
        try {
            const proxyUrl = `https://wsrv.nl/?url=${encodeURIComponent(url)}&output=jpg&w=800`;
            const response = await fetch(proxyUrl);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) { return null; }
    }
</script>
</body>
</html>
