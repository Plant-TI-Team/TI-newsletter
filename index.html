<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Plant TI 뉴스레터 매직 빌더 V56.1</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f9; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .ver { text-align: right; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 28px; }
        .section-title { color: #FF8C00; border-bottom: 2px solid #FF8C00; padding-bottom: 8px; margin-top: 30px; font-weight: bold; }
        .config-panel { background: #f8f9fa; border: 1px solid #e1e8ed; padding: 20px; border-radius: 10px; margin-top: 20px; display: flex; gap: 30px; align-items: center; }
        .config-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: #2c3e50; }
        input[type="color"] { width: 40px; height: 40px; border: none; cursor: pointer; background: none; }
        #dropzone { width: 100%; min-height: 150px; border: 3px dashed #FF8C00; border-radius: 10px; padding: 15px; box-sizing: border-box; background-color: #fffaf0; font-size: 14px; margin-bottom: 15px; white-space: pre-wrap; }
        .article-select-item { display: flex; align-items: center; gap: 15px; padding: 12px 15px; background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; margin-bottom: 8px; }
        .article-select-item input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; }
        .title-text { font-weight: bold; font-size: 15px; color: #2c3e50; }
        .image-drop-mini { width: 110px; height: 65px; border: 2px dashed #00467F; background: #f8f9fa; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .image-drop-mini img { max-width: 100%; max-height: 100%; }
        #final-section { display: none; margin-top: 40px; }
        .size-control-card { background: #f8f9fa; border-left: 5px solid #FF8C00; padding: 12px 15px; margin-bottom: 8px; border-radius: 4px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        button.primary-btn { display: block; width: 100%; background: #2c3e50; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button.primary-btn:hover { background: #1a252f; }
        #outlook-result { background: white; border: 1px solid #e1e8ed; margin-top: 20px; padding: 0; }
        .notice-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; border: 1px solid #ffeeba; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <div class="ver">Version 56.1</div>
    <h1>📧 Plant TI 뉴스레터 매직 빌더</h1>
    <h3 class="section-title">Step 1. 기사 입력 및 제목 추출</h3>
    <div id="dropzone" contenteditable="true" placeholder="Gems 기사를 여기에 붙여넣으세요"></div>
    <button class="primary-btn" onclick="parseArticles()">1단계: 분석 및 제목 리스트 생성 🔍</button>
    <div id="selection-area" style="display:none; margin-top:20px;">
        <div class="config-panel">
            <div class="config-item">🎨 기사 제목 색상: <input type="color" id="titleColor" value="#D35400"></div>
            <div class="config-item">🔘 버튼 배경 색상: <input type="color" id="btnColor" value="#00467F"></div>
            <div class="config-item">📝 버튼 글자 색상: <input type="color" id="btnTextColor" value="#D1D1D1"></div>
        </div>
        <div id="selection-list" style="margin-top:20px;"></div>
        <button class="primary-btn" style="background:#FF8C00; margin-top:20px;" onclick="generateFinal()">2단계: 최종 뉴스레터 생성 및 크기 조절 📋</button>
    </div>
    <div id="final-section">
        <h3 class="section-title" style="color:#2c3e50; border-color:#2c3e50;">Step 2. 최종 결과물 (디자인 확인)</h3>
        <div id="size-controls"></div>
        <div id="outlook-result"></div>
        <div style="margin-top:30px;">
            <div class="notice-box">💡 <b>3단계 아웃룩 복사 안내:</b> 붙여넣기 시 <b>'원문 서식 유지(K)'</b>를 선택하세요.</div>
            <button class="primary-btn" style="background:#27ae60;" onclick="copyToClipboard()">3단계 아웃룩 본문으로 복사하기 ✨</button>
        </div>
    </div>
</div>
<script>
    let articles = [];
    document.getElementById('dropzone').addEventListener('paste', function(e) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text/plain');
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        selection.deleteFromDocument();
        const textNode = document.createTextNode(text);
        selection.getRangeAt(0).insertNode(textNode);
        selection.collapseToEnd();
    });

    function parseArticles() {
        const rawText = document.getElementById('dropzone').innerText;
        const blocks = rawText.split(/기사\s*\d+\./);
        articles = [];
        for (let i = 1; i < blocks.length; i++) {
            let block = blocks[i].trim();
            let lines = block.split('\n');
            let cleanTitle = lines[0].replace(/^(제목\s*[:：]\s*)/i, "").trim();
            let urlMatch = block.match(/https?:\/\/[^\s\]<>"]+/);
            articles.push({ title: cleanTitle, url: urlMatch ? urlMatch[0] : "#", contentHtml: lines.slice(1).join('<br>'), selected: true, imgWidth: 320 });
        }
        renderSelection();
    }

    function renderSelection() {
        const list = document.getElementById('selection-list');
        list.innerHTML = '';
        articles.forEach((art, idx) => {
            const item = document.createElement('div');
            item.className = 'article-select-item';
            item.innerHTML = `
                <input type="checkbox" checked onchange="articles[${idx}].selected = this.checked">
                <div style="flex:1;">
                    <div class="title-text">${idx+1}. ${art.title}</div>
                    <button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(art.title)}')">제목 검색 🔍</button>
                    <input type="text" value="${art.url}" style="width:100%; margin-top:5px;" onchange="articles[${idx}].url = this.value">
                </div>
                <div class="image-drop-mini" id="drop_${idx}" ondragover="event.preventDefault();" ondrop="handleDrop(event, ${idx})">그림 던지기</div>
            `;
            list.appendChild(item);
        });
        document.getElementById('selection-area').style.display = 'block';
    }

    // (setImage, generateFinal, updateSize, copyToClipboard 등 나머지 함수는 V56 기존 코드 유지)
    async function handleDrop(e, idx) { e.preventDefault(); const file = e.dataTransfer.files[0]; if(file){ const reader = new FileReader(); reader.onload = (ev) => { articles[idx].imgData = ev.target.result; document.getElementById('drop_'+idx).innerHTML = `<img src="${ev.target.result}">`; }; reader.readAsDataURL(file); } }
    function generateFinal() { 
        const res = document.getElementById('outlook-result');
        const controls = document.getElementById('size-controls');
        controls.innerHTML = '';
        let html = `<div style="max-width:850px; margin:0 auto;">`;
        articles.forEach((a, i) => {
            if(!a.selected) return;
            html += `<div style="padding:20px; border-bottom:1px solid #eee;">
                <h2 style="color:${document.getElementById('titleColor').value}">${a.title}</h2>
                <p>${a.contentHtml}</p>
                <a href="${a.url}" style="background:${document.getElementById('btnColor').value}; color:${document.getElementById('btnTextColor').value}; padding:10px; text-decoration:none;">기사 원문 읽기 →</a>
            </div>`;
        });
        res.innerHTML = html + "</div>";
        document.getElementById('final-section').style.display = 'block';
    }
    function copyToClipboard() { const r = document.createRange(); r.selectNodeContents(document.getElementById('outlook-result')); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); document.execCommand('copy'); alert("복사 완료!"); }
</script>
</body>
</html>
