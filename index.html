<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Plant TI 뉴스레터 매직 빌더 V76</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f9; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .ver { text-align: right; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 28px; }
        .section-title { color: #D35400; border-bottom: 2px solid #D35400; padding-bottom: 8px; margin-top: 30px; font-weight: bold; }
        .ai-panel { background: #f0f7ff; border: 1px solid #b3d7ff; padding: 25px; border-radius: 10px; margin-bottom: 20px; }
        .ai-key-box { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; border-bottom: 1px dashed #b3d7ff; padding-bottom: 15px; }
        .ai-key-box input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        .domain-box { display: flex; gap: 10px; margin-bottom: 25px; align-items: center; background: #e6f2ff; padding: 12px; border-radius: 6px; border: 1px solid #b3d7ff; }
        .domain-box input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        .sub-step-box { background: white; border: 1px solid #cce2ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .sub-step-title { font-size: 14px; font-weight: bold; color: #00467F; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .ai-textarea { width: 100%; min-height: 160px; border: 1px solid #b3d7ff; border-radius: 6px; padding: 12px; box-sizing: border-box; font-size: 14px; resize: vertical; line-height: 1.5; }
        .config-panel { background: #f8f9fa; border: 1px solid #e1e8ed; padding: 20px; border-radius: 10px; margin-top: 20px; display: flex; gap: 30px; align-items: center; }
        .config-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: #2c3e50; }
        input[type="color"] { width: 40px; height: 40px; border: none; cursor: pointer; background: none; }
        #dropzone { width: 100%; min-height: 200px; border: 3px dashed #D35400; border-radius: 10px; padding: 15px; box-sizing: border-box; background-color: #fffaf0; font-size: 14px; margin-bottom: 15px; white-space: pre-wrap; word-break: break-all; }
        .article-select-item { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; margin-bottom: 8px; }
        .article-select-item input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; }
        .title-text { flex: 1; font-weight: bold; font-size: 15px; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-drop-mini { width: 110px; height: 65px; border: 2px dashed #00467F; background: #f8f9fa; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .image-drop-mini img { max-width: 100%; max-height: 100%; }
        #final-section { display: none; margin-top: 40px; }
        .size-control-card { background: #f8f9fa; border-left: 5px solid #D35400; padding: 12px 15px; margin-bottom: 8px; border-radius: 4px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        button.primary-btn { display: block; width: 100%; background: #2c3e50; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button.primary-btn:hover { background: #1a252f; }
        .btn-new-tab { background: #5d6d7e; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .split-ai-btn { background: #00467F; color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .split-ai-btn:hover { background: #002d54; }
        .split-ai-btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        #outlook-result { background: white; border: 1px solid #e1e8ed; margin-top: 20px; padding: 0; }
        .notice-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; border: 1px solid #ffeeba; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="ver">Version 76.0 (Ultimate Master)</div>
    <h1>📧 Plant TI 뉴스레터 매직 빌더</h1>
    
    <div class="ai-panel">
        <div class="ai-key-box">
            <span style="font-size: 13px; font-weight: bold; color: #333;">🔑 Gemini API Key:</span>
            <input type="password" id="apiKey" placeholder="Google AI Studio API Key">
        </div>
        <div class="domain-box">
            <span style="font-size: 13px; font-weight: bold; color: #00467F;">🌐 우선 검색 도메인:</span>
            <input type="text" id="targetDomains" placeholder="예: iaea.org, reuters.com">
        </div>
        
        <div class="sub-step-box">
            <div class="sub-step-title">🛠️ 전반부 기사 가이드라인</div>
            <textarea id="aiPromptTech" class="ai-textarea"></textarea>
            <button class="split-ai-btn" id="btnTech" onclick="generateTechArticles()">1) 전반부 기사 추출 시작 🛠️</button>
        </div>

        <div class="sub-step-box">
            <div class="sub-step-title">💼 후반부 기사 가이드라인</div>
            <textarea id="aiPromptBiz" class="ai-textarea"></textarea>
            <button class="split-ai-btn" id="btnBiz" style="background:#27ae60;" onclick="generateBizArticles()">2) 후반부 기사 이어 붙이기 💼</button>
        </div>
    </div>
    
    <h3 class="section-title">Step 1. 통합 기사 확인 및 정제</h3>
    <div id="dropzone" contenteditable="true" placeholder="결과물들이 이곳에 적재됩니다."></div>
    <button class="primary-btn" onclick="parseArticles()">1단계: 통합 분석 및 제목 리스트 생성 🔍</button>
    
    <div id="selection-area" style="display:none; margin-top:20px;">
        <div class="config-panel">
            <div class="config-item">🎨 제목 색상: <input type="color" id="titleColor" value="#D35400"></div>
            <div class="config-item">🔘 버튼 색상: <input type="color" id="btnColor" value="#00467F"></div>
            <div class="config-item">📝 글자 색상: <input type="color" id="btnTextColor" value="#D1D1D1"></div>
        </div>
        <div id="selection-list" style="margin-top:20px;"></div>
        <button class="primary-btn" style="background:#D35400; margin-top:20px;" onclick="generateFinal()">2단계: 최종 뉴스레터 생성 📋</button>
    </div>

    <div id="final-section">
        <h3 class="section-title" style="color:#2c3e50; border-color:#2c3e50;">Step 2. 최종 결과물</h3>
        <div id="size-controls"></div>
        <div id="outlook-result"></div>
        <button class="primary-btn" style="background:#27ae60; margin-top:30px;" onclick="copyToClipboard()">3단계 아웃룩 본문으로 복사하기 ✨</button>
    </div>
</div>

<script>
    let articles = [];

    window.onload = function() {
        const savedKey = localStorage.getItem('plant_ti_gemini_key');
        if(savedKey) document.getElementById('apiKey').value = savedKey;
        const savedDomains = localStorage.getItem('plant_ti_gemini_domains');
        document.getElementById('targetDomains').value = savedDomains ? savedDomains : `iaea.org, world-nuclear.org, nei.org, world-nuclear-news.org, power-eng.com, inl.gov, nucnet.org, ans.org, neimagazine.com`;
        const defaultPrompt = `최우선 검색 도메인을 참고하여 지난 2주 이내의 관련 기사를 최대 5개 선정하라.
[필수 출력 규칙]
1. 본문은 상세히 작성하라.
2. 기사 출처 URL은 반드시 실제 접속 가능한 원문을 찾아서 출력하라.
[포맷]
기사 1. [기사 제목]
기사 날짜 : [MM월 DD일]
[소제목]
-. [본문 요약]
기사 출처 : [순수 URL]`;
        const savedTech = localStorage.getItem('plant_ti_gemini_prompt_tech');
        document.getElementById('aiPromptTech').value = savedTech ? savedTech : defaultPrompt;
        const savedBiz = localStorage.getItem('plant_ti_gemini_prompt_biz');
        document.getElementById('aiPromptBiz').value = savedBiz ? savedBiz : defaultPrompt;
    }

    function getSecureInstruction(customDomains) {
        return `너는 뉴스레터 작성을 돕는 최고급 AI 비서다.
        1. [검색 지침]: ${customDomains ? '지정한 도메인(' + customDomains + ')을 최우선 검색하고, 필요시 공신력 있는 매체로 확장하라.' : '공신력 있는 원자력/에너지 전문 매체들을 검색하라.'}
        2. https://ko.wikipedia.org/wiki/%EA%B2%80%EC%A6%9D: 기사 요약 작성 후, 구글의 Grounding 결과에서 원본 URL을 반드시 찾아내어 정확히 출력하라. 절대 URL을 임의로 상상해서 적지 마라.
        3. [번역]: 기사 제목은 한국 독자가 이해하기 쉽게 한국어로 번역/의역하라.
        4. [포맷]: 사용자의 요구사항을 준수하되, 서론 없이 즉시 '기사 1.' 로 시작하라.`;
    }

    async function callGeminiAPI(key, prompt, systemInstruction) {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                tools: [{"googleSearch": {}}] 
            })
        });
        const data = await response.json();
        let text = data.candidates[0].content.parts[0].text;
        
        let realUrls = [];
        try {
            data.candidates[0].groundingMetadata.groundingChunks.forEach(c => { if(c.web && c.web.uri) realUrls.push(c.web.uri); });
        } catch(e) {}
        if(realUrls.length > 0) text += "\n\n[🛡️ 팩트 체크 원본 링크]\n" + [...new Set(realUrls)].join("\n");
        return text;
    }

    async function generateTechArticles() {
        const apiKey = document.getElementById('apiKey').value.trim();
        localStorage.setItem('plant_ti_gemini_key', apiKey);
        localStorage.setItem('plant_ti_gemini_prompt_tech', document.getElementById('aiPromptTech').value);
        try {
            const result = await callGeminiAPI(apiKey, document.getElementById('aiPromptTech').value, getSecureInstruction(document.getElementById('targetDomains').value));
            document.getElementById('dropzone').innerText = result.trim();
            parseArticles();
        } catch(e) { alert("오류 발생: Key와 설정을 확인하세요."); }
    }

    async function generateBizArticles() {
        const apiKey = document.getElementById('apiKey').value.trim();
        localStorage.setItem('plant_ti_gemini_key', apiKey);
        localStorage.setItem('plant_ti_gemini_prompt_biz', document.getElementById('aiPromptBiz').value);
        try {
            const current = document.getElementById('dropzone').innerText;
            const count = (current.match(/기사\s*\d+\./g) || []).length;
            const result = await callGeminiAPI(apiKey, document.getElementById('aiPromptBiz').value, getSecureInstruction(document.getElementById('targetDomains').value));
            const processed = result.replace(/기사\s*(\d+)\./g, (m, n) => `기사 ${parseInt(n) + count}.`);
            document.getElementById('dropzone').innerText = current.trim() + "\n\n" + processed.trim();
            parseArticles();
        } catch(e) { alert("오류 발생: Key와 설정을 확인하세요."); }
    }

    function parseArticles() {
        const raw = document.getElementById('dropzone').innerText;
        const blocks = raw.split(/기사\s*\d+\./); articles = [];
        for (let i = 1; i < blocks.length; i++) {
            let block = blocks[i].trim();
            let title = block.split('\n')[0].trim();
            let urlMatch = block.match(/https?:\/\/[^\s]+/);
            let url = urlMatch ? urlMatch[0] : "#";
            let contentHtml = block.split('\n').slice(1).map(line => {
                if (!line.trim().startsWith('-.')) return `<p style="margin:0 0 10px 0; font-family:'맑은 고딕',sans-serif; font-size:15px; color:#333333; line-height:1.7;"><b>[${line.trim().replace(/[\[\]]/g, "")}]</b></p>`;
                return `<p style="margin:0 0 10px 0; font-family:'맑은 고딕',sans-serif; font-size:15px; color:#333333; line-height:1.7;">${line.trim().replace(/\[(.*?)\]/g, "<b>[$1]</b>")}</p>`;
            }).join('');
            articles.push({ title, url, contentHtml, selected: true, imgWidth: 320 });
        }
        renderSelection();
    }
    
    function renderSelection() { 
        const list = document.getElementById('selection-list'); list.innerHTML = ''; 
        articles.forEach((art, idx) => { 
            const item = document.createElement('div'); item.className = 'article-select-item';
            item.innerHTML = `<input type="checkbox" checked onchange="articles[${idx}].selected = this.checked"> <div class="title-text">${idx+1}. ${art.title}</div> <button class="btn-new-tab" onclick="window.open('${art.url}')">AI 링크 🔗</button> <button class="btn-new-tab" style="background:#e67e22;" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(art.title)}')">검색 🔍</button> <div class="image-drop-mini" id="drop_${idx}" ondragover="event.preventDefault();" ondrop="handleDrop(event, ${idx})">그림 던지기</div>`;
            list.appendChild(item);
        });
        document.getElementById('selection-area').style.display = 'block';
    }
    
    // ... 나머지 유틸리티 함수(handleDrop, generateFinal, copyToClipboard 등) 생략 (동일 유지)
</script>
</body>
</html>
