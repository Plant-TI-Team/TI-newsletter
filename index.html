<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Plant TI 뉴스레터 매직 빌더 V76.1</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f9; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .ver { text-align: right; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 28px; }
        .section-title { color: #D35400; border-bottom: 2px solid #D35400; padding-bottom: 8px; margin-top: 30px; font-weight: bold; }
        .ai-panel { background: #f0f7ff; border: 1px solid #b3d7ff; padding: 25px; border-radius: 10px; margin-bottom: 20px; }
        .ai-key-box { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; border-bottom: 1px dashed #b3d7ff; padding-bottom: 15px; }
        .ai-key-box input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        .domain-box { display: flex; gap: 10px; margin-bottom: 25px; align-items: center; background: #e6f2ff; padding: 12px; border-radius: 6px; border: 1px solid #b3d7ff; }
        .domain-box input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        .sub-step-box { background: white; border: 1px solid #cce2ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .sub-step-title { font-size: 14px; font-weight: bold; color: #00467F; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .ai-textarea { width: 100%; min-height: 160px; border: 1px solid #b3d7ff; border-radius: 6px; padding: 12px; box-sizing: border-box; font-size: 14px; resize: vertical; line-height: 1.5; }
        .config-panel { background: #f8f9fa; border: 1px solid #e1e8ed; padding: 20px; border-radius: 10px; margin-top: 20px; display: flex; gap: 30px; align-items: center; }
        .config-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: #2c3e50; }
        input[type="color"] { width: 40px; height: 40px; border: none; cursor: pointer; background: none; }
        #dropzone { width: 100%; min-height: 200px; border: 3px dashed #D35400; border-radius: 10px; padding: 15px; box-sizing: border-box; background-color: #fffaf0; font-size: 14px; margin-bottom: 15px; white-space: pre-wrap; word-break: break-all; }
        .article-select-item { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; margin-bottom: 8px; }
        .article-select-item input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; }
        .title-text { flex: 1; font-weight: bold; font-size: 15px; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-drop-mini { width: 110px; height: 65px; border: 2px dashed #00467F; background: #f8f9fa; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .image-drop-mini img { max-width: 100%; max-height: 100%; }
        #final-section { display: none; margin-top: 40px; }
        .size-control-card { background: #f8f9fa; border-left: 5px solid #D35400; padding: 12px 15px; margin-bottom: 8px; border-radius: 4px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        button.primary-btn { display: block; width: 100%; background: #2c3e50; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button.primary-btn:hover { background: #1a252f; }
        .btn-new-tab { background: #5d6d7e; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .split-ai-btn { background: #00467F; color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .split-ai-btn:hover { background: #002d54; }
        #outlook-result { background: white; border: 1px solid #e1e8ed; margin-top: 20px; padding: 0; }
        .notice-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; border: 1px solid #ffeeba; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <div class="ver">Version 76.1 (Stable Final)</div>
    <h1>📧 Plant TI 뉴스레터 매직 빌더</h1>
    <div class="ai-panel">
        <div class="ai-key-box">
            <span style="font-size: 13px; font-weight: bold; color: #333;">🔑 Gemini API Key:</span>
            <input type="password" id="apiKey" placeholder="Google AI Studio API Key">
        </div>
        <div class="domain-box">
            <span style="font-size: 13px; font-weight: bold; color: #00467F;">🌐 우선 검색 도메인:</span>
            <input type="text" id="targetDomains" placeholder="예: iaea.org, reuters.com">
        </div>
        <div class="sub-step-box">
            <div class="sub-step-title">🛠️ 전반부 가이드라인</div>
            <textarea id="aiPromptTech" class="ai-textarea"></textarea>
            <button class="split-ai-btn" onclick="generateArticles('Tech')">1) 전반부 기사 추출 시작 🛠️</button>
        </div>
        <div class="sub-step-box">
            <div class="sub-step-title">💼 후반부 가이드라인</div>
            <textarea id="aiPromptBiz" class="ai-textarea"></textarea>
            <button class="split-ai-btn" style="background:#27ae60;" onclick="generateArticles('Biz')">2) 후반부 기사 이어 붙이기 💼</button>
        </div>
    </div>
    <div id="dropzone" contenteditable="true"></div>
    <button class="primary-btn" onclick="parseArticles()">1단계: 분석 및 제목 리스트 생성 🔍</button>
    <div id="selection-area" style="display:none; margin-top:20px;">
        <div id="selection-list"></div>
        <button class="primary-btn" style="background:#D35400; margin-top:20px;" onclick="generateFinal()">2단계: 최종 뉴스레터 생성 📋</button>
    </div>
    <div id="final-section">
        <div id="size-controls"></div>
        <div id="outlook-result"></div>
        <button class="primary-btn" style="background:#27ae60; margin-top:30px;" onclick="copyToClipboard()">3단계 아웃룩 본문 복사 ✨</button>
    </div>
</div>
<script>
    let articles = [];
    async function callGeminiAPI(prompt, domains) {
        const key = document.getElementById('apiKey').value;
        const system = `너는 뉴스레터 작성을 돕는 최고급 AI 비서다. ${domains ? '다음 도메인('+domains+')을 우선 검색하고, 필요시 확장하라.' : ''} https://ko.wikipedia.org/wiki/%ED%8C%A9%ED%8A%B8%EC%B2%B4%ED%81%AC: 검색 데이터의 원본 링크만 정확히 기입하라. 절대 URL을 임의로 상상하지 마라. [포맷]: 사용자가 준 포맷을 준수하고, 서론 없이 '기사 1.'부터 시작하라.`;
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${key}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: system }] }, tools: [{"googleSearch": {}}] })
        });
        const data = await res.json();
        let text = data.candidates[0].content.parts[0].text;
        let urls = [];
        try { data.candidates[0].groundingMetadata.groundingChunks.forEach(c => { if(c.web) urls.push(c.web.uri); }); } catch(e) {}
        if(urls.length > 0) text += "\n\n[🛡️ 팩트 원본 링크]\n" + [...new Set(urls)].join("\n");
        return text;
    }
    async function generateArticles(type) {
        const prompt = document.getElementById(type === 'Tech' ? 'aiPromptTech' : 'aiPromptBiz').value;
        const drop = document.getElementById('dropzone');
        const count = (drop.innerText.match(/기사\s*\d+\./g) || []).length;
        try {
            const res = await callGeminiAPI(prompt, document.getElementById('targetDomains').value);
            const proc = res.replace(/기사\s*(\d+)\./g, (m, n) => `기사 ${parseInt(n) + count}.`);
            drop.innerText = (type === 'Tech' ? "" : drop.innerText + "\n\n") + proc.trim();
            parseArticles();
        } catch(e) { alert("연동 오류 발생"); }
    }
    function parseArticles() {
        const raw = document.getElementById('dropzone').innerText;
        const blocks = raw.split(/기사\s*\d+\./); articles = [];
        for (let i = 1; i < blocks.length; i++) {
            let b = blocks[i].trim();
            let title = b.split('\n')[0].trim();
            let url = (b.match(/https?:\/\/[^\s]+/)||["#"])[0];
            let html = b.split('\n').slice(1).map(l => {
                if(!l.trim().startsWith('-.')) return `<p style="margin:0; font-family:'맑은 고딕';"><b>[${l.trim().replace(/[\[\]]/g, "")}]</b></p>`;
                return `<p style="margin:0; font-family:'맑은 고딕';">${l.trim().replace(/\[(.*?)\]/g, "<b>[$1]</b>")}</p>`;
            }).join('');
            articles.push({ title, url, html, selected: true, imgWidth: 320 });
        }
        const list = document.getElementById('selection-list'); list.innerHTML = '';
        articles.forEach((a, i) => {
            list.innerHTML += `<div class="article-select-item"><input type="checkbox" checked onchange="articles[${i}].selected = this.checked"> <div class="title-text">${a.title}</div> <button class="btn-new-tab" onclick="window.open('${a.url}')">링크 🔗</button> <button class="btn-new-tab" style="background:#e67e22;" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(a.title)}')">제목검색 🔍</button></div>`;
        });
        document.getElementById('selection-area').style.display = 'block';
    }
    function generateFinal() {
        const res = document.getElementById('outlook-result');
        res.innerHTML = articles.filter(a => a.selected).map((a, i) => `
            <div style="padding:20px; border-bottom:1px solid #ddd;">
                <h2 style="color:#D35400;">기사 ${i+1}. ${a.title}</h2>
                ${a.html}
                <div style="margin-top:15px;"><a href="${a.url}" style="background:#00467F; color:white; padding:10px 20px; text-decoration:none;">기사 원문 읽기 →</a></div>
            </div>`).join('');
        document.getElementById('final-section').style.display = 'block';
    }
    function copyToClipboard() { const r = document.createRange(); r.selectNodeContents(document.getElementById('outlook-result')); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); document.execCommand('copy'); alert("복사 완료!"); }
</script>
</body>
</html>
